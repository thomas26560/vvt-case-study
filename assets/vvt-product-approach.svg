<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">VVT public product approach</title>
  <desc id="desc">A non-technical product map showing four stages: discover field reality, define product decisions, deliver through iteration, and create operational value. A feedback loop connects adoption back to discovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#E9EEF4"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B38"/>
      <stop offset="1" stop-color="#153A68"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C97838"/>
      <stop offset="1" stop-color="#E6A15D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#0A1B38" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C97838"/>
    </marker>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7B8EA5"/>
    </marker>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <circle cx="1510" cy="30" r="220" fill="#C97838" opacity="0.06"/>
  <circle cx="45" cy="675" r="190" fill="#153A68" opacity="0.05"/>

  <text x="80" y="66" fill="#0A1B38" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="1.7">FROM FIELD REALITY TO OPERATIONAL VALUE</text>
  <text x="80" y="101" fill="#607087" font-family="Inter, Arial, sans-serif" font-size="16">A public product map — method only, never system architecture.</text>
  <rect x="1290" y="54" width="230" height="38" rx="19" fill="#F8E9DA"/>
  <circle cx="1315" cy="73" r="5" fill="#C97838"/>
  <text x="1330" y="79" fill="#8F4E20" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">NON-TECHNICAL VIEW</text>

  <!-- Flow arrows -->
  <path d="M405 315H455" fill="none" stroke="#7B8EA5" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <path d="M775 315H825" fill="none" stroke="#7B8EA5" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <path d="M1145 315H1195" fill="none" stroke="#7B8EA5" stroke-width="3" marker-end="url(#arrowNavy)"/>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="85" y="158" width="320" height="340" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="125" cy="205" r="22" fill="#F8E9DA"/>
  <text x="125" y="213" text-anchor="middle" fill="#A65B24" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">1</text>
  <text x="160" y="202" fill="#C97838" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">DISCOVER</text>
  <text x="120" y="266" fill="#0A1B38" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Field reality</text>
  <text x="120" y="295" fill="#6A7A8E" font-family="Inter, Arial, sans-serif" font-size="14">Start with the work as it is done.</text>
  <rect x="120" y="329" width="250" height="44" rx="12" fill="#F5F7FA"/>
  <circle cx="143" cy="351" r="7" fill="#C97838"/>
  <text x="161" y="357" fill="#263951" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Observe the environment</text>
  <rect x="120" y="386" width="250" height="44" rx="12" fill="#F5F7FA"/>
  <circle cx="143" cy="408" r="7" fill="#C97838"/>
  <text x="161" y="414" fill="#263951" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Listen to users</text>
  <rect x="120" y="443" width="250" height="44" rx="12" fill="#F5F7FA"/>
  <circle cx="143" cy="465" r="7" fill="#C97838"/>
  <text x="161" y="471" fill="#263951" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Map recurring friction</text>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="455" y="158" width="320" height="340" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="495" cy="205" r="22" fill="#E7EEF7"/>
  <text x="495" y="213" text-anchor="middle" fill="#31567F" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">2</text>
  <text x="530" y="202" fill="#4E7197" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">DEFINE</text>
  <text x="490" y="266" fill="#0A1B38" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Product decisions</text>
  <text x="490" y="295" fill="#6A7A8E" font-family="Inter, Arial, sans-serif" font-size="14">Turn needs into a usable scope.</text>
  <rect x="490" y="329" width="250" height="44" rx="12" fill="#F5F7FA"/>
  <circle cx="513" cy="351" r="7" fill="#537BA6"/>
  <text x="531" y="357" fill="#263951" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Clarify roles</text>
  <rect x="490" y="386" width="250" height="44" rx="12" fill="#F5F7FA"/>
  <circle cx="513" cy="408" r="7" fill="#537BA6"/>
  <text x="531" y="414" fill="#263951" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Prioritise useful information</text>
  <rect x="490" y="443" width="250" height="44" rx="12" fill="#F5F7FA"/>
  <circle cx="513" cy="465" r="7" fill="#537BA6"/>
  <text x="531" y="471" fill="#263951" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Set acceptance criteria</text>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="825" y="158" width="320" height="340" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="865" cy="205" r="22" fill="#E7EEF7"/>
  <text x="865" y="213" text-anchor="middle" fill="#31567F" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">3</text>
  <text x="900" y="202" fill="#4E7197" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">DELIVER</text>
  <text x="860" y="266" fill="#0A1B38" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Build · test · improve</text>
  <text x="860" y="295" fill="#6A7A8E" font-family="Inter, Arial, sans-serif" font-size="14">Short loops anchored in real use.</text>
  <rect x="860" y="329" width="250" height="44" rx="12" fill="#F5F7FA"/>
  <circle cx="883" cy="351" r="7" fill="#537BA6"/>
  <text x="901" y="357" fill="#263951" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Create a testable version</text>
  <rect x="860" y="386" width="250" height="44" rx="12" fill="#F5F7FA"/>
  <circle cx="883" cy="408" r="7" fill="#537BA6"/>
  <text x="901" y="414" fill="#263951" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Validate in the field</text>
  <rect x="860" y="443" width="250" height="44" rx="12" fill="#F5F7FA"/>
  <circle cx="883" cy="465" r="7" fill="#537BA6"/>
  <text x="901" y="471" fill="#263951" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Refine from feedback</text>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="1195" y="158" width="320" height="340" rx="22" fill="url(#navy)"/>
  </g>
  <circle cx="1235" cy="205" r="22" fill="#E6A15D"/>
  <text x="1235" y="213" text-anchor="middle" fill="#0A1B38" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">4</text>
  <text x="1270" y="202" fill="#E6A15D" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">ADOPT</text>
  <text x="1230" y="266" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Operational value</text>
  <text x="1230" y="295" fill="#B7C6D8" font-family="Inter, Arial, sans-serif" font-size="14">A tool becomes part of the work.</text>
  <rect x="1230" y="329" width="250" height="44" rx="12" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="1253" cy="351" r="7" fill="#E6A15D"/>
  <text x="1271" y="357" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">One shared reference</text>
  <rect x="1230" y="386" width="250" height="44" rx="12" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="1253" cy="408" r="7" fill="#E6A15D"/>
  <text x="1271" y="414" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Clearer ownership</text>
  <rect x="1230" y="443" width="250" height="44" rx="12" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="1253" cy="465" r="7" fill="#E6A15D"/>
  <text x="1271" y="471" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Operational continuity</text>

  <!-- Feedback loop -->
  <path d="M1355 522V565Q1355 590 1330 590H270Q245 590 245 565V522" fill="none" stroke="url(#copper)" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="558" y="566" width="484" height="49" rx="24.5" fill="#FFFFFF" stroke="#E1E7EE"/>
  <text x="800" y="596" text-anchor="middle" fill="#8F4E20" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">USER FEEDBACK CREATES THE NEXT IMPROVEMENT</text>

  <!-- Human-led delivery bar -->
  <rect x="85" y="647" width="1430" height="46" rx="14" fill="#0A1B38"/>
  <text x="120" y="676" fill="#E6A15D" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.1">THOMAS SIMON</text>
  <text x="275" y="676" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14">Field expertise + product ownership + human validation</text>
  <circle cx="790" cy="670" r="4" fill="#7187A0"/>
  <text x="820" y="676" fill="#B7C6D8" font-family="Inter, Arial, sans-serif" font-size="14">AI-assisted design and delivery</text>
  <text x="1480" y="676" text-anchor="end" fill="#8296AE" font-family="Inter, Arial, sans-serif" font-size="12">PUBLIC METHOD VIEW</text>
</svg>
