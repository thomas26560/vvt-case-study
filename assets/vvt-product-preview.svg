  <text x="78" y="72" fill="#0A1B38" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2">VVT</text>
  <text x="150" y="72" fill="#607087" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.6">SYNTHETIC PRODUCT PREVIEW</text>
  <text x="78" y="112" fill="#263951" font-family="Inter, Arial, sans-serif" font-size="20">Designed around the work, not around the software.</text>

